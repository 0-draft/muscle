name: Weekly review

# Monday 07:00 JST: summarize the week that ended Sunday and post it as an issue (phone notification).
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Summarize and post
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: kanywst
        run: |
          end=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          week=$(date -d "$end" +%G-W%V)
          node scripts/review.mjs --end "$end" > review.md
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title review' --json number,title,author \
              --jq '.[] | select((.title | startswith("[review] ")) and .author.login == "app/github-actions") | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Superseded by the ${week} review."
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[review] ${week}" --body-file review.md --assignee "$ASSIGNEE"
